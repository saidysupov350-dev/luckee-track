<!DOCTYPE html>
<html lang="ru" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Luckee Track</title>
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" type="image/png" href="icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Luckee Track">
<meta name="mobile-web-app-capable" content="yes">

<style>
:root{
  --green:#1f7a4d; --green-dark:#175c3a; --green-light:#e6f3ec;
  --bg:#c5c9ce; --card:#ffffff; --text:#16201b; --muted:#6b7972; --border:#e2e6e3; --danger:#c0453a;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#12140f; --card:#1b1f18; --text:#eef1ec; --muted:#9aa79f; --border:#2a2f28; --green-light:#173427;
  }
}
:root[data-theme="dark"]{
  --bg:#12140f; --card:#1b1f18; --text:#eef1ec; --muted:#9aa79f; --border:#2a2f28; --green-light:#173427;
}
html{scroll-padding-top:env(safe-area-inset-top,0px); height:100%;}
*{box-sizing:border-box;}
body{margin:0; min-height:100%; background:var(--bg); color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif; -webkit-font-smoothing:antialiased;}
.wrap{max-width:640px; margin:0 auto; padding:16px 16px 60px;}
header{padding-top:calc(env(safe-area-inset-top,0px) + 8px); margin-bottom:14px;}
.headtop{display:flex; justify-content:space-between; align-items:flex-start;}
h1{font-size:22px; margin:0 0 2px; font-weight:700; letter-spacing:-0.01em;}
.role{color:var(--muted); font-size:14px;}
.linkbtn{background:none; border:none; color:var(--green); font-size:14px; font-weight:600; cursor:pointer; padding:6px 0;}
.lockrow{display:flex; align-items:center; gap:6px; color:var(--green); font-size:14px; font-weight:600; margin:10px 0 14px; cursor:pointer;}
.pillrow{display:flex; gap:8px; overflow-x:auto; margin-bottom:10px; padding-bottom:2px;}
.pill{flex:none; padding:9px 16px; border-radius:20px; border:1px solid var(--border); background:var(--card); color:var(--text); font-size:14px; cursor:pointer; white-space:nowrap;}
.pill.active{background:var(--green); border-color:var(--green); color:#fff;}
input[type=text], input[type=number]{width:100%; padding:12px 14px; border-radius:12px; border:1px solid var(--border); background:var(--card); color:var(--text); font-size:15px; outline:none;}
input:focus{border-color:var(--green);}
.search{margin-bottom:14px;}
.summary{background:var(--green-light); border-radius:14px; padding:14px 16px; margin-bottom:16px;}
.summary .label{color:var(--green-dark); font-weight:700; font-size:13px; margin-bottom:6px;}
.summary .empty{color:var(--muted); font-size:14px;}
.entry-row{display:flex; justify-content:space-between; align-items:center; padding:8px 6px; border-radius:8px; border-bottom:1px solid rgba(0,0,0,.06); font-size:14px; gap:8px;}
.entry-row.marked{background:var(--green); color:#fff; border-bottom-color:transparent;}
.entry-row.marked .del{color:#fff; text-decoration:underline;}
.entry-row:last-child{border-bottom:none;}
.entry-row .del{color:var(--danger); background:none; border:none; font-size:13px; cursor:pointer; padding:4px 6px; flex:none;}
.card{background:var(--card); border:1px solid var(--border); border-radius:14px; padding:14px 16px; margin-bottom:10px; display:flex; justify-content:space-between; align-items:center; gap:10px;}
.card .name{font-weight:600; font-size:15px; margin-bottom:2px;}
.tags{display:flex; gap:6px; flex-wrap:wrap;}
.tag{background:#eef0f2; border:1px solid var(--border); color:var(--muted); font-size:12px; padding:2px 8px; border-radius:6px;}
.addbtn{width:36px; height:36px; border-radius:50%; background:var(--green); color:#fff; border:none; font-size:20px; line-height:1; cursor:pointer; flex:none;}
.qtybox{display:flex; align-items:center; gap:8px; flex:none;}
.qtybox input{width:64px; padding:8px; text-align:center;}
.qtybox button{background:var(--green); color:#fff; border:none; border-radius:8px; padding:8px 12px; font-size:13px; font-weight:600; cursor:pointer;}
.qtybox .cancel{background:none; color:var(--muted); font-size:13px; border:none; cursor:pointer;}
.addcatalog{color:var(--green); font-weight:600; font-size:15px; cursor:pointer; background:none; border:none; padding:4px 0; margin-bottom:6px; display:block;}
.empty-state{color:var(--muted); font-size:14px; padding:4px 0 12px;}
.form-card{background:var(--card); border:1px solid var(--border); border-radius:14px; padding:16px; margin-bottom:14px;}
.form-row{display:flex; gap:8px; margin-bottom:10px;}
.form-row > *{flex:1;}
.primary-btn{background:var(--green); color:#fff; border:none; border-radius:10px; padding:12px; font-size:15px; font-weight:600; cursor:pointer; width:100%;}
.ghost-btn{background:none; border:1px solid var(--border); color:var(--text); border-radius:10px; padding:11px; font-size:14px; font-weight:600; cursor:pointer; width:100%;}
.modal-bg{position:fixed; inset:0; background:rgba(0,0,0,.4); display:flex; align-items:flex-end; justify-content:center; z-index:20;}
.modal{background:var(--card); border-radius:18px 18px 0 0; padding:20px; width:100%; max-width:640px; max-height:80vh; overflow:auto; padding-bottom:calc(20px + env(safe-area-inset-bottom,0px));}
.modal h3{margin:0 0 14px;}
.modal .close{display:block; margin:14px auto 0; background:none; border:none; color:var(--muted); font-size:14px;}
.code-row{display:flex; justify-content:space-between; align-items:center; gap:10px; padding:10px 0; border-bottom:1px solid var(--border);}
.code-row:last-child{border-bottom:none;}
.code-row span{font-size:14px;}
.code-row input{width:110px; padding:8px; text-align:center;}
.msg{font-size:13px; color:var(--danger); margin-top:8px; min-height:16px;}
/* login */
#loginScreen{max-width:420px; margin:0 auto; padding:40px 20px; padding-top:calc(40px + env(safe-area-inset-top,0px));}
#loginScreen h1{text-align:center; margin-bottom:24px;}
.roletabs{display:flex; gap:8px; margin-bottom:20px;}
.roletab{flex:1; text-align:center; padding:12px; border-radius:12px; border:1px solid var(--border); background:var(--card); cursor:pointer; font-weight:600; font-size:14px; color:var(--muted);}
.roletab.active{background:var(--green-light); color:var(--green-dark); border-color:var(--green);}
select{width:100%; padding:12px 14px; border-radius:12px; border:1px solid var(--border); background:var(--card); color:var(--text); font-size:15px;}
.field{margin-bottom:14px;}
.field label{display:block; font-size:13px; color:var(--muted); margin-bottom:6px;}
.hint{font-size:12px; color:var(--muted); margin-top:10px; text-align:center;}
input,select,textarea{font-size:16px !important;}
.statusbar{background:#e6f3ec; color:#175c3a; border-radius:12px; padding:10px 12px; margin:0 0 12px; font-size:14px;}
.statusbar.err{background:#fdecea; color:#c0453a;}
.statusbar .linkbtn{color:#c0453a; padding:6px 0 0;}
</style>
</head>
<body>

<div id="loginScreen" style="display:none;">
  <h1>Списания</h1>
  <div class="roletabs">
    <button class="roletab active" id="roleTovarovedBtn">Товаровед</button>
    <button class="roletab" id="roleChefBtn">Шеф ресторана</button>
  </div>
  <div id="chefRestField" class="field" style="display:none;">
    <label>Ресторан</label>
    <select id="chefRestSelect"></select>
  </div>
  <div id="chefPositionField" class="field" style="display:none;">
    <label>Кто списывает?</label>
    <select id="chefPositionSelect">
      <option value="Шеф">Шеф</option>
      <option value="Су-шеф">Су-шеф</option>
    </select>
  </div>
  <div class="field">
    <label>Код доступа</label>
    <input type="text" id="codeInput" placeholder="Введите код" inputmode="numeric">
  </div>
  <button class="primary-btn" id="loginBtn">Войти</button>
  <div class="msg" id="loginMsg"></div>
</div>

<div id="appScreen" style="display:none;">
  <div class="wrap">
    <header>
      <div class="headtop">
        <div>
          <h1>Списания</h1>
          <div class="role" id="roleLabel"></div>
        </div>
        <button class="linkbtn" id="logoutBtn">Сменить</button>
      </div>
      <div class="lockrow" id="codesLink" style="display:none;">🔒 Управление кодами доступа</div>
    </header>

    <div id="statusBar" class="statusbar" style="display:none;"></div>
    <div class="pillrow" id="restPills"></div>
    <div class="pillrow" id="catPills"></div>
    <div class="summary">
      <div class="label" id="summaryLabel"></div>
      <div id="todayList"></div>
    </div>

    <div style="display:flex; gap:16px; align-items:center;">
      <button class="linkbtn" id="historyBtn" style="padding:0 0 14px; display:block;">📅 История списаний</button>
      <button class="linkbtn" id="trashBtn" style="padding:0 0 14px; display:none;">🗑 Корзина</button>
    </div>

    <input type="text" id="search" class="search" placeholder="Найти товар...">

    <div id="catalogArea"></div>
  </div>
</div>

<div id="modalRoot"></div>
<div id="confirmRoot"></div>

<script>
(function(){
  var RESTAURANTS = [
    {id:'dostyk', name:'Luckee Yu Достык'},
    {id:'dostyk-plaza', name:'Luckee Yu Достык Плаза'},
    {id:'mega-almaty', name:'Luckee Yu Мега Алматы'},
    {id:'mega-astana', name:'Luckee Yu Мега Астана'}
  ];
  var CATEGORIES = ['Отработка','Порча','Бракераж','Стафф','Невозвратные отходы'];
  var DEFAULT_CODES = {tovaroved:'0000', 'dostyk':'1111', 'dostyk-plaza':'2222', 'mega-almaty':'3333', 'mega-astana':'4444'};
  var SESSION_KEY = 'spisaniya_session_v2';

  // ===== Подключение к Google Таблице через Apps Script =====
  // ВСТАВЬТЕ сюда адрес веб-приложения Apps Script (заканчивается на /exec):
  var API_URL = 'https://script.google.com/macros/s/AKfycbxpceWNZKWDZq0udJvRr9xYJJTINbKTsl2ch7guDwtxQNG9gjgx8Bt0ib9XHQGA7L8/exec';
  var POLL_MS = 30000;          // как часто (сек) сайт спрашивает сервер об изменениях, пока страница открыта
  var FULL_REFRESH_MS = 300000; // раз в 5 минут — полная перезагрузка (на случай правок таблицы руками)

  function apiConfigured(){ return API_URL.indexOf('/exec') > 0; }

  // Журнал запросов (виден, если открыть сайт с ?debug=1)
  var apiLog = [];
  function dlog(s){
    apiLog.push(new Date().toTimeString().slice(0,8) + ' ' + s);
    if(apiLog.length > 40) apiLog.shift();
    var d = document.getElementById('dbgPanel');
    if(d){ d.textContent = apiLog.join('\n'); d.scrollTop = d.scrollHeight; }
  }
  function sleep(ms){ return new Promise(function(r){ setTimeout(r, ms); }); }

  // До 3 попыток: у Google бывают разовые сбои и медленный «холодный» старт.
  // Повторять безопасно: сервер игнорирует повторную отправку одной и той же записи.
  async function apiRaw(action, body){
    if(!apiConfigured()) throw new Error('API_URL_NOT_SET');
    var payload = JSON.stringify(Object.assign({action:action}, body||{}));
    var lastErr = null;
    for(var attempt = 1; attempt <= 3; attempt++){
      var t0 = Date.now();
      try{
        var res = await fetch(API_URL, {method:'POST', body: payload});
        var text = await res.text();
        var data;
        try{ data = JSON.parse(text); }
        catch(parseErr){
          lastErr = new Error('BAD_RESPONSE');
          lastErr.detail = 'HTTP ' + res.status + ': ' + text.replace(/\s+/g, ' ').slice(0, 120);
          dlog(action + ' #' + attempt + ' ответ не JSON: ' + lastErr.detail);
          if(attempt < 3) await sleep(1200 * attempt);
          continue;
        }
        dlog(action + ' #' + attempt + ' ok, ' + (Date.now() - t0) + ' мс, ' + text.length + ' байт' + (data && data.ok === false ? ', ответ: ' + data.error : ''));
        return data;
      }catch(netErr){
        lastErr = netErr;
        lastErr.detail = String(netErr && netErr.message || netErr);
        dlog(action + ' #' + attempt + ' сеть: ' + lastErr.detail);
        if(attempt < 3) await sleep(1200 * attempt);
      }
    }
    throw lastErr;
  }

  function describeError(e){
    if(!e) return 'неизвестная ошибка';
    if(e.message === 'API_URL_NOT_SET') return 'не указан адрес сервера (API_URL в index.html)';
    if(e.message === 'BAD_RESPONSE') return 'Google вернул страницу с ошибкой (' + (e.detail || '') + ')';
    if(e.detail) return 'нет связи с сервером (' + e.detail + ')';
    return String(e.message || e);
  }

  // Состояние первой загрузки: чтобы «Загрузка…» не выглядело как «пусто»
  var loadState = {catalog:false, entries:false, error:'', retries:0};
  function isLoaded(){ return loadState.catalog && loadState.entries; }
  function renderStatus(){
    var el = document.getElementById('statusBar');
    if(!el) return;
    if(isLoaded()){
      if(pendingOps > 0){ el.style.display = 'block'; el.className = 'statusbar'; el.textContent = '⏳ Сохраняем…'; }
      else { el.style.display = 'none'; }
      return;
    }
    el.style.display = 'block';
    if(loadState.error){
      el.className = 'statusbar err';
      el.innerHTML = '<div>Не удалось загрузить данные: ' + esc(loadState.error) + '</div><button class="linkbtn" id="retryBtn">Повторить</button>';
      var b = document.getElementById('retryBtn');
      if(b) b.onclick = function(){ loadState.error = ''; loadState.retries = 0; renderStatus(); db.refreshNow(); };
    } else {
      el.className = 'statusbar';
      el.textContent = '⏳ Загрузка данных… (в первый раз может занять до 15 секунд)';
    }
  }

  function toast(text){
    var t = document.getElementById('toast');
    if(!t){
      t = document.createElement('div'); t.id = 'toast';
      t.style.cssText = 'position:fixed;left:12px;right:12px;bottom:16px;max-width:600px;margin:0 auto;background:#16201b;color:#fff;padding:12px 14px;border-radius:12px;font-size:14px;z-index:99;text-align:center;';
      document.body.appendChild(t);
    }
    t.textContent = text; t.style.display = 'block';
    clearTimeout(t._h); t._h = setTimeout(function(){ t.style.display = 'none'; }, 4500);
  }

  function handleAuthLost(){
    if(!session) return;
    dlog('сервер не принял код (auth) — выход на экран входа');
    clearSession(); session = null;
    if(unsubCatalog) unsubCatalog();
    if(unsubEntries) unsubEntries();
    showLogin();
    document.getElementById('loginMsg').textContent = 'Код изменён или отключён. Войдите снова.';
  }

  async function api(action, body){
    var payload = Object.assign({auth: session ? {role:session.role, restaurant:session.restaurant||null, code:session.code} : null}, body||{});
    var data;
    try{ data = await apiRaw(action, payload); }
    catch(e){
      toast(e.message === 'API_URL_NOT_SET' ? 'Не указан адрес сервера (API_URL в index.html).'
          : e.message === 'BAD_RESPONSE' ? 'Google вернул ошибку вместо ответа. Попробуйте ещё раз через минуту.'
          : 'Нет связи с сервером. Проверьте интернет.');
      throw e;
    }
    if(data && data.ok === false){
      if(data.error === 'auth'){ handleAuthLost(); }
      else { toast('Ошибка: ' + (data.message || data.error)); }
      throw new Error(data.error || 'api');
    }
    return data;
  }

  // Слой, который выглядит как прежняя база (doc/get/set/onSnapshot), но работает через сервер.
  // Изменения отправляются точечно (добавить/изменить/удалить конкретные записи), поэтому
  // два человека, работающие одновременно, не затирают друг друга.
  function makeDb(){
    var st = {entries:{}, entriesVer:{}, catalog:null, catalogVer:null};
    var L = {entries:{}, catalog:[]};
    var timer = null, lastFull = 0;
    var clone = function(v){ return v == null ? v : JSON.parse(JSON.stringify(v)); };

    function groupCatalog(list){
      var g = {};
      (list||[]).forEach(function(p){
        var it = {id:p.id, name:p.name, unit:p.unit};
        if(p.article) it.article = p.article;
        (g[p.category] = g[p.category] || []).push(it);
      });
      return g;
    }
    function entriesSnap(rid){ var v = st.entries[rid]; return {exists: v!==undefined, data:function(){ return {items: clone(v||[])}; }}; }
    function catalogSnap(){ var v = st.catalog; return {exists: v!==null, data:function(){ return groupCatalog(v); }}; }
    function notifyEntries(rid){ (L.entries[rid]||[]).slice().forEach(function(cb){ setTimeout(function(){ cb(entriesSnap(rid)); }, 0); }); }
    function notifyCatalog(){ L.catalog.slice().forEach(function(cb){ setTimeout(function(){ cb(catalogSnap()); }, 0); }); }

    function applyState(rid, r){
      var chE = false, chC = false;
      if(r.entries){ if(JSON.stringify(r.entries) !== JSON.stringify(st.entries[rid])) chE = true; st.entries[rid] = r.entries; }
      if(r.entriesVersion !== undefined) st.entriesVer[rid] = r.entriesVersion;
      if(r.catalog){ if(JSON.stringify(r.catalog) !== JSON.stringify(st.catalog)) chC = true; st.catalog = r.catalog; }
      if(r.catalogVersion !== undefined) st.catalogVer = r.catalogVersion;
      if(chE) notifyEntries(rid);
      if(chC) notifyCatalog();
    }
    async function refresh(rid, full){
      try{
        var r = await api('getState', {
          restaurant: rid,
          entriesVersion: (full || st.entriesVer[rid] === undefined) ? null : st.entriesVer[rid],
          catalogVersion: (full || st.catalogVer === null) ? null : st.catalogVer
        });
        applyState(rid, r);
        if(st.entries[rid] !== undefined) loadState.entries = true;
        if(st.catalog !== null) loadState.catalog = true;
        loadState.error = ''; loadState.retries = 0;
        renderStatus();
      }catch(e){
        if(session && !isLoaded()){
          loadState.error = describeError(e);
          renderStatus();
          if(loadState.retries < 3){
            loadState.retries++;
            setTimeout(function(){ if(session && !isLoaded()) refresh(rid, true).catch(function(){}); }, 4000);
          }
        }
        throw e;
      }
    }
    async function tick(force){
      if(document.hidden || !session) return;
      var full = force || (Date.now() - lastFull) > FULL_REFRESH_MS;
      if(full) lastFull = Date.now();
      var rids = Object.keys(L.entries).filter(function(k){ return L.entries[k].length; });
      for(var i=0;i<rids.length;i++){ try{ await refresh(rids[i], full); }catch(e){} }
    }
    function startPolling(){
      if(timer) return;
      timer = setInterval(function(){ tick(false); }, POLL_MS);
      document.addEventListener('visibilitychange', function(){ if(!document.hidden) tick(true); });
    }

    async function setEntries(rid, v){
      var prev = st.entries[rid] || [], next = (v && v.items) || [], pm = {}, nm = {};
      prev.forEach(function(e){ pm[e.id] = e; }); next.forEach(function(e){ nm[e.id] = e; });
      var add = [], update = [], del = [];
      next.forEach(function(e){
        var p = pm[e.id];
        if(!p){ add.push({id:e.id, date:e.date, category:e.category, name:e.name, unit:e.unit, qty:e.qty, author:e.author}); return; }
        var f = {};
        if(!!e.archived !== !!p.archived) f.archived = !!e.archived;
        if(!!e.trashed !== !!p.trashed) f.trashed = !!e.trashed;
        if(Object.keys(f).length) update.push({id:e.id, fields:f});
      });
      prev.forEach(function(p){ if(!nm[p.id]) del.push(p.id); });
      if(!add.length && !update.length && !del.length) return;
      applyState(rid, await api('entryOps', {restaurant:rid, add:add, update:update, del:del}));
    }

    async function setCatalog(v){
      var prev = st.catalog || [], pm = {}, seen = {}, add = [], update = [], del = [];
      prev.forEach(function(p){ pm[p.id] = p; });
      Object.keys(v || {}).forEach(function(cat){
        (v[cat] || []).forEach(function(p){
          seen[p.id] = true;
          var q = pm[p.id];
          if(!q) add.push({id:p.id, category:cat, name:p.name, unit:p.unit, article:p.article || ''});
          else if(q.name !== p.name || q.unit !== p.unit || (q.article || '') !== (p.article || ''))
            update.push({id:p.id, fields:{name:p.name, unit:p.unit, article:p.article || ''}});
        });
      });
      prev.forEach(function(p){ if(!seen[p.id]) del.push(p.id); });
      if(!add.length && !update.length && !del.length) return;
      applyState(activeRestaurant, await api('catalogOps', {add:add, update:update, del:del}));
    }

    return {
      refreshNow: function(){ return refresh(activeRestaurant, true).catch(function(){}); },
      doc: function(path){
        var kind = path.split('/')[0], id = path.split('/')[1];
        return {
          get: async function(){
            if(kind === 'config'){ var r = await api('getCodes'); return {exists:true, data:function(){ return r.codes; }}; }
            if(kind === 'entries'){ if(st.entries[id] === undefined) await refresh(id, true); return entriesSnap(id); }
            if(st.catalog === null) await refresh(activeRestaurant, true);
            return catalogSnap();
          },
          set: async function(v){
            if(kind === 'config'){ await api('setCodes', {codes: v}); return; }
            if(kind === 'entries') return setEntries(id, v);
            return setCatalog(v);
          },
          onSnapshot: function(cb, errCb){
            if(kind === 'entries'){
              (L.entries[id] = L.entries[id] || []).push(cb);
              if(st.entries[id] !== undefined) setTimeout(function(){ cb(entriesSnap(id)); }, 0);
              refresh(id, false).catch(function(e){ if(errCb) errCb(e); });
              startPolling();
              return function(){ L.entries[id] = (L.entries[id] || []).filter(function(x){ return x !== cb; }); };
            }
            if(kind === 'catalog'){
              L.catalog.push(cb);
              if(st.catalog !== null) setTimeout(function(){ cb(catalogSnap()); }, 0);
              return function(){ L.catalog = L.catalog.filter(function(x){ return x !== cb; }); };
            }
            return function(){};
          }
        };
      }
    };
  }

  async function archiveChecked(){
    var ids = Object.keys(checkedForArchive);
    if(ids.length===0) return;
    var idSet = {};
    ids.forEach(function(id){ idSet[id]=true; });
    var prev = entriesData;
    var next = entriesData.map(function(e){
      if(idSet[e.id]) return Object.assign({}, e, {archived:true});
      return e;
    });
    entriesData = next; checkedForArchive = {}; renderSummary();
    return syncEntries(prev, next, 'Не удалось отметить записи как внесённые.');
  }

  // Изменения сразу показываются на экране, а на сервер уходят в фоне по очереди
  // (в порядке нажатий). Если сохранить не удалось — откат и понятное сообщение.
  var pendingOps = 0;
  var syncChain = Promise.resolve();
  function syncEntries(prev, next, failText){
    var rid = activeRestaurant;
    pendingOps++; renderStatus();
    syncChain = syncChain.then(function(){
      return db.doc('entries/'+rid).set({items: next});
    }).catch(function(e){
      console.error(e);
      if(rid === activeRestaurant){ entriesData = prev; checkedForArchive = {}; renderSummary(); }
      toast(failText + ' ' + (e && e.message === 'BAD_RESPONSE' ? 'Google вернул ошибку.' : 'Нет связи с сервером.') + ' Попробуйте ещё раз.');
      if(db && db.refreshNow) db.refreshNow();
    }).then(function(){ pendingOps--; renderStatus(); });
    return syncChain;
  }

  async function removeEntry(entryId){
    var prev = entriesData;
    var next = entriesData.filter(function(x){ return x.id!==entryId; });
    entriesData = next; renderSummary();
    return syncEntries(prev, next, 'Не удалось удалить запись.');
  }

  var QTY_WARN_THRESHOLD = 100;

  async function addEntry(product){
    var input = document.getElementById('qtyInputField');
    if(!input) return;                          // второе нажатие: окно ввода уже закрыто
    var qty = parseFloat(input.value);
    if(!qty || qty<=0) return;
    if(qty >= QTY_WARN_THRESHOLD){
      askConfirm('Указано '+qty+' '+product.unit+' — «'+product.name+'». Обычно списывают меньше. Точно верное количество?', function(){
        saveEntry(product, qty);
      }, 'Да, верно', 'Проверю ещё раз');
      return;
    }
    saveEntry(product, qty);
  }

  async function saveEntry(product, qty){
    var author = session.role==='tovaroved' ? 'Товаровед' : (session.position || 'Шеф');
    var entry = {id:uid(), name:product.name, unit:product.unit, category:activeCategory, qty:qty, date:todayStr(), ts:Date.now(), author:author};
    var prev = entriesData;
    var next = entriesData.concat([entry]);
    entriesData = next; openQtyFor = null;      // запись видна сразу
    renderSummary(); renderCatalogArea();
    return syncEntries(prev, next, 'Не удалось сохранить запись.');
  }

  // Ассортимент общий для всех ресторанов: любое изменение каталога применяем ко всем четырём
  async function updateCatalogEverywhere(mutate){
    // Каталог один на все рестораны (лист «Товары»), поэтому пишем один раз
    var ref = db.doc('catalog/'+activeRestaurant);
    var snap = await ref.get();
    var data = snap.exists ? (snap.data() || {}) : {};
    var next = Object.assign({}, data);
    next[activeCategory] = mutate((data[activeCategory] || []).slice());
    await ref.set(next);
  }
  function sameProduct(x, prod){ return x.id===prod.id || (x.name===prod.name && x.unit===prod.unit); }

  async function deleteProduct(prod){
    try{ await updateCatalogEverywhere(function(list){ return list.filter(function(x){ return !sameProduct(x, prod); }); }); }
    catch(e){ console.error(e); }
  }

  function openEditProductModal(product){
    var root = document.getElementById('modalRoot');
    root.innerHTML =
      '<div class="modal-bg" id="modalBg"><div class="modal">'+
      '<h3>Изменить товар</h3>'+
      '<div class="field"><label>Название товара</label><input type="text" id="ePName" value="'+esc(product.name)+'"></div>'+
      '<div class="field"><label>Единица измерения</label>'+
      '<select id="ePUnit">'+
        ['кг','шт','л','г'].map(function(u){ return '<option value="'+u+'"'+(u===product.unit?' selected':'')+'>'+u+'</option>'; }).join('')+
      '</select></div>'+
      '<div class="field"><label>Артикул (необязательно)</label><input type="text" id="ePArticle" value="'+esc(product.article||'')+'" placeholder="Например, 13601"></div>'+
      '<button class="primary-btn" id="ePSave">Сохранить</button>'+
      '<button class="close" id="ePClose">Отмена</button>'+
      '</div></div>';
    root.querySelector('#ePClose').onclick = function(){ root.innerHTML=''; };
    root.querySelector('#modalBg').addEventListener('click', function(e){ if(e.target.id==='modalBg') root.innerHTML=''; });
    root.querySelector('#ePSave').onclick = async function(){
      var newName = root.querySelector('#ePName').value.trim();
      if(!newName) return;
      var newUnit = root.querySelector('#ePUnit').value;
      var newArticle = root.querySelector('#ePArticle').value.trim();
      try{
        await updateCatalogEverywhere(function(list){
          return list.map(function(x){
            if(!sameProduct(x, product)) return x;
            var updated = Object.assign({}, x, {name:newName, unit:newUnit});
            if(newArticle){ updated.article = newArticle; } else { delete updated.article; }
            return updated;
          });
        });
        root.innerHTML = '';
      }catch(e){ console.error(e); }
    };
  }

  function openAddProductModal(){
    var root = document.getElementById('modalRoot');
    root.innerHTML =
      '<div class="modal-bg" id="modalBg"><div class="modal">'+
      '<h3>Добавить товар</h3>'+
      '<div class="field"><label>Название товара</label><input type="text" id="pName"></div>'+
      '<div class="field"><label>Единица измерения</label>'+
      '<select id="pUnit"><option value="кг">кг</option><option value="шт">шт</option><option value="л">л</option><option value="г">г</option></select></div>'+
      '<div class="field"><label>Артикул (необязательно)</label><input type="text" id="pArticle" placeholder="Например, 13601"></div>'+
      '<button class="primary-btn" id="pSave">Добавить</button>'+
      '<button class="close" id="pClose">Отмена</button>'+
      '</div></div>';
    root.querySelector('#pClose').onclick = function(){ root.innerHTML=''; };
    root.querySelector('#modalBg').addEventListener('click', function(e){ if(e.target.id==='modalBg') root.innerHTML=''; });
    root.querySelector('#pSave').onclick = async function(){
      var name = root.querySelector('#pName').value.trim();
      if(!name) return;
      var unit = root.querySelector('#pUnit').value;
      var article = root.querySelector('#pArticle').value.trim();
      var newProduct = {id:uid(), name:name, unit:unit};
      if(article) newProduct.article = article;
      try{
        await updateCatalogEverywhere(function(list){
          var exists = list.some(function(x){ return x.name===name && x.unit===unit; });
          return exists ? list : list.concat([newProduct]);
        });
        root.innerHTML = '';
      }catch(e){ console.error(e); }
    };
  }

  function askConfirm(message, onYes, yesLabel, noLabel){
    var root = document.getElementById('confirmRoot');
    root.innerHTML =
      '<div class="modal-bg" id="confirmBg" style="z-index:60;"><div class="modal" style="max-width:380px;">'+
      '<h3 style="margin-bottom:20px;">'+esc(message)+'</h3>'+
      '<button class="primary-btn" id="confirmYes" style="background:var(--danger); margin-bottom:8px;">'+esc(yesLabel||'Удалить')+'</button>'+
      '<button class="ghost-btn" id="confirmNo">'+esc(noLabel||'Отмена')+'</button>'+
      '</div></div>';
    root.querySelector('#confirmYes').onclick = function(){ root.innerHTML=''; onYes(); };
    root.querySelector('#confirmNo').onclick = function(){ root.innerHTML=''; };
    root.querySelector('#confirmBg').addEventListener('click', function(e){ if(e.target.id==='confirmBg') root.innerHTML=''; });
  }


  function pad2(n){ return n<10 ? '0'+n : ''+n; }
  function getISOWeekString(d){
    var date = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
    var dayNum = date.getUTCDay() || 7;
    date.setUTCDate(date.getUTCDate() + 4 - dayNum);
    var yearStart = new Date(Date.UTC(date.getUTCFullYear(),0,1));
    var weekNo = Math.ceil((((date - yearStart) / 86400000) + 1)/7);
    return date.getUTCFullYear() + '-W' + pad2(weekNo);
  }
  function weekStringToRange(wk){
    var parts = wk.split('-W');
    var year = parseInt(parts[0],10), week = parseInt(parts[1],10);
    var jan4 = new Date(Date.UTC(year,0,4));
    var jan4Day = jan4.getUTCDay() || 7;
    var monday = new Date(jan4);
    monday.setUTCDate(jan4.getUTCDate() - jan4Day + 1 + (week-1)*7);
    var sunday = new Date(monday);
    sunday.setUTCDate(monday.getUTCDate()+6);
    function fmt(d){ return d.getUTCFullYear()+'-'+pad2(d.getUTCMonth()+1)+'-'+pad2(d.getUTCDate()); }
    return {from: fmt(monday), to: fmt(sunday)};
  }


  function openTrashModal(){
    var root = document.getElementById('modalRoot');
    var trashSearchTerm = '';

    root.innerHTML =
      '<div class="modal-bg" id="modalBg"><div class="modal">'+
      '<h3>🗑 Корзина · '+esc(activeCategory)+' · '+esc(restName(activeRestaurant))+'</h3>'+
      '<input type="text" id="trashSearch" placeholder="Найти товар в корзине..." style="margin-bottom:14px;">'+
      '<div id="trashBody"></div>'+
      '<button class="close" id="trashClose">Закрыть</button>'+
      '</div></div>';

    root.querySelector('#trashSearch').addEventListener('input', function(ev){
      trashSearchTerm = ev.target.value;
      renderBody();
    });
    root.querySelector('#trashClose').onclick = function(){ root.innerHTML=''; };
    root.querySelector('#modalBg').addEventListener('click', function(e){ if(e.target.id==='modalBg') root.innerHTML=''; });

    function renderBody(){
      var bodyEl = root.querySelector('#trashBody');
      var list = entriesData.filter(function(e){
        var matchesSearch = !trashSearchTerm || e.name.toLowerCase().indexOf(trashSearchTerm.toLowerCase())>-1;
        return e.category===activeCategory && e.trashed===true && matchesSearch;
      });
      var bodyHtml;
      if(list.length===0){
        bodyHtml = '<div class="empty-state">Корзина пуста.</div>';
      } else {
        var byDate = {};
        list.forEach(function(e){ (byDate[e.date] = byDate[e.date]||[]).push(e); });
        var dates = Object.keys(byDate).sort().reverse();
        bodyHtml = '';
        dates.forEach(function(d){
          bodyHtml += '<div class="date-group">'+esc(d)+'</div>';
          byDate[d].slice().reverse().forEach(function(e){
            bodyHtml += '<div class="entry-row"><span>'+esc(e.name)+' — '+e.qty+' '+esc(e.unit)+'</span>'+
              '<button class="del" data-trash-del="'+esc(e.id)+'">Удалить</button></div>';
          });
        });
        bodyHtml += '<button class="ghost-btn" id="trashClearAllBtn" style="margin-top:16px; color:var(--danger); border-color:var(--danger);">Очистить корзину ('+list.length+')</button>';
      }
      bodyEl.innerHTML = bodyHtml;

      bodyEl.querySelectorAll('[data-trash-del]').forEach(function(btn){
        btn.onclick = function(){
          var id = btn.getAttribute('data-trash-del');
          var entry = list.find(function(x){ return x.id===id; });
          var label = entry ? ('«'+entry.name+'» — '+entry.qty+' '+entry.unit) : 'эту запись';
          askConfirm('Точно удалить '+label+' из корзины насовсем?', async function(){
            await removeEntry(id);
            renderBody();
          }, 'Да', 'Нет');
        };
      });

      var clearAllBtn = bodyEl.querySelector('#trashClearAllBtn');
      if(clearAllBtn){
        clearAllBtn.onclick = function(){
          askConfirm('Точно очистить корзину? Будет удалено записей: '+list.length, async function(){
            var idsToRemove = {};
            list.forEach(function(e){ idsToRemove[e.id] = true; });
            var next = entriesData.filter(function(e){ return !idsToRemove[e.id]; });
            try{
              await db.doc('entries/'+activeRestaurant).set({items: next});
              renderBody();
            }catch(err){ console.error(err); }
          }, 'Да', 'Нет');
        };
      }
    }

    renderBody();
  }

  function openHistoryModal(){
    var root = document.getElementById('modalRoot');
    var mode = 'day';
    var today = todayStr();
    var curMonth = today.slice(0,7);

    root.innerHTML =
      '<div class="modal-bg" id="modalBg"><div class="modal">'+
      '<h3>История · '+esc(activeCategory)+' · '+esc(restName(activeRestaurant))+'</h3>'+
      '<div class="roletabs" style="margin-bottom:16px;">'+
        '<button class="roletab active" id="modeDay">День</button>'+
        '<button class="roletab" id="modeWeek">Неделя</button>'+
        '<button class="roletab" id="modeMonth">Месяц</button>'+
        '<button class="roletab" id="modePeriod">Период</button>'+
      '</div>'+
      '<div id="dateFields"></div>'+
      '<button class="primary-btn" id="histShow" style="margin-top:6px;">Показать</button>'+
      '<input type="text" id="histSearch" placeholder="Найти товар в результатах..." style="margin-top:12px;">'+
      '<div id="histResults"></div>'+
      '<button class="close" id="histClose">Закрыть</button>'+
      '</div></div>';

    var histSearchTerm = '';
    root.querySelector('#histSearch').addEventListener('input', function(ev){
      histSearchTerm = ev.target.value;
      showResults();
    });

    function renderFields(){
      var el = root.querySelector('#dateFields');
      if(mode==='day'){
        el.innerHTML = '<div class="field"><label>Дата</label><input type="date" id="fDay" value="'+today+'"></div>';
      } else if(mode==='week'){
        el.innerHTML = '<div class="field"><label>Неделя</label><input type="week" id="fWeek" value="'+getISOWeekString(new Date())+'"></div>';
      } else if(mode==='month'){
        el.innerHTML = '<div class="field"><label>Месяц</label><input type="month" id="fMonth" value="'+curMonth+'"></div>';
      } else {
        el.innerHTML = '<div class="field"><label>С</label><input type="date" id="fFrom" value="'+today+'"></div>'+
          '<div class="field"><label>По</label><input type="date" id="fTo" value="'+today+'"></div>';
      }
    }
    function setMode(m){
      mode = m;
      ['modeDay','modeWeek','modeMonth','modePeriod'].forEach(function(id){ root.querySelector('#'+id).classList.remove('active'); });
      root.querySelector('#mode'+m.charAt(0).toUpperCase()+m.slice(1)).classList.add('active');
      renderFields();
    }
    root.querySelector('#modeDay').onclick = function(){ setMode('day'); };
    root.querySelector('#modeWeek').onclick = function(){ setMode('week'); };
    root.querySelector('#modeMonth').onclick = function(){ setMode('month'); };
    root.querySelector('#modePeriod').onclick = function(){ setMode('period'); };
    renderFields();

    var lastFrom = null, lastTo = null;

    function computeRange(){
      var from, to;
      if(mode==='day'){
        from = to = root.querySelector('#fDay').value;
      } else if(mode==='week'){
        var wk = root.querySelector('#fWeek').value; // YYYY-Www
        var range = weekStringToRange(wk);
        from = range.from; to = range.to;
      } else if(mode==='month'){
        var m = root.querySelector('#fMonth').value; // YYYY-MM
        from = m + '-01';
        var d = new Date(m+'-01T00:00:00');
        var last = new Date(d.getFullYear(), d.getMonth()+1, 0).getDate();
        to = m + '-' + String(last).padStart(2,'0');
      } else {
        from = root.querySelector('#fFrom').value;
        to = root.querySelector('#fTo').value;
      }
      return {from:from, to:to};
    }

    function showResults(){
      var range = computeRange();
      lastFrom = range.from; lastTo = range.to;
      if(!lastFrom || !lastTo){ return; }
      var resEl = root.querySelector('#histResults');
      var list = entriesData.filter(function(e){
        var matchesSearch = !histSearchTerm || e.name.toLowerCase().indexOf(histSearchTerm.toLowerCase())>-1;
        return e.category===activeCategory && e.date>=lastFrom && e.date<=lastTo && e.trashed!==true && matchesSearch;
      });
      if(list.length===0){
        resEl.innerHTML = '<div class="empty-state">Списаний за этот период нет.</div>';
        return;
      }
      var byDate = {};
      list.forEach(function(e){ (byDate[e.date] = byDate[e.date]||[]).push(e); });
      var dates = Object.keys(byDate).sort().reverse();
      var html = '';
      dates.forEach(function(d){
        html += '<div class="date-group">'+esc(d)+'</div>';
        byDate[d].slice().reverse().forEach(function(e){
          var statusHtml = e.archived===true
            ? '<span style="color:var(--green); font-size:12px; font-weight:600;">✓ внесено</span>'
            : '<span style="color:var(--muted); font-size:12px;">не внесено</span>';
          html += '<div class="entry-row"><span>'+esc(e.name)+' — '+e.qty+' '+esc(e.unit)+'</span>'+
            '<span style="display:flex; align-items:center; gap:10px;">'+statusHtml+
            (session && session.role==='tovaroved' ? '<button class="del" data-hist-del="'+esc(e.id)+'">Удалить</button>' : '')+'</span></div>';
        });
      });
      var totals = {};
      list.forEach(function(e){
        var key = e.name+'|'+e.unit;
        totals[key] = (totals[key]||0) + e.qty;
      });
      var keys = Object.keys(totals).sort();
      html += '<div class="date-group">Итого за период</div>';
      keys.forEach(function(k){
        var parts = k.split('|');
        html += '<div class="entry-row"><span>'+esc(parts[0])+'</span><span>'+ (Math.round(totals[k]*100)/100) +' '+esc(parts[1])+'</span></div>';
      });
      html += '<button class="ghost-btn" id="histExportBtn" style="margin-top:16px;">⬇️ Скачать CSV</button>';
      if(session && session.role==='tovaroved'){
        html += '<button class="ghost-btn" id="histDeleteAllBtn" style="margin-top:10px; color:var(--danger); border-color:var(--danger);">Переместить все записи за период в корзину ('+list.length+')</button>';
      }
      resEl.innerHTML = html;

      resEl.querySelector('#histExportBtn').onclick = async function(){
        if(!downloadsCap){
          alert('Скачивание файлов недоступно в этом окне просмотра.');
          return;
        }
        var csvRows = [['Дата','Товар','Количество','Ед.','Статус','Кто списал']];
        list.forEach(function(e){
          csvRows.push([e.date, e.name, e.qty, e.unit, e.archived===true?'внесено':'не внесено', e.author||'']);
        });
        var csv = csvRows.map(function(row){
          return row.map(function(cell){
            var s = String(cell==null?'':cell);
            if(s.indexOf(';')>-1 || s.indexOf('"')>-1 || s.indexOf('\n')>-1){
              s = '"'+s.replace(/"/g,'""')+'"';
            }
            return s;
          }).join(';');
        }).join('\r\n');
        var csvWithBom = '\uFEFF' + csv;
        var fname = 'spisaniya_'+esc(activeCategory)+'_'+lastFrom+'_'+lastTo+'.csv';
        try{
          await downloadsCap.save({filename: fname, data: csvWithBom});
        }catch(err){ console.error(err); }
      };

      var delAllBtn = resEl.querySelector('#histDeleteAllBtn');
      if(delAllBtn) delAllBtn.onclick = function(){
        askConfirm('Переместить все записи за этот период в корзину? Позиций: '+list.length, async function(){
          var idSet = {};
          list.forEach(function(e){ idSet[e.id] = true; });
          var next = entriesData.map(function(e){
            return idSet[e.id] ? Object.assign({}, e, {trashed:true}) : e;
          });
          try{
            await db.doc('entries/'+activeRestaurant).set({items: next});
            showResults();
          }catch(err){ console.error(err); }
        }, 'Да', 'Нет');
      };

      resEl.querySelectorAll('[data-hist-del]').forEach(function(btn){
        btn.onclick = function(){
          var id = btn.getAttribute('data-hist-del');
          var entry = list.find(function(x){ return x.id===id; });
          var label = entry ? ('«'+entry.name+'» — '+entry.qty+' '+entry.unit) : 'эту запись';
          askConfirm('Переместить '+label+' в корзину?', async function(){
            var next = entriesData.map(function(x){
              return x.id===id ? Object.assign({}, x, {trashed:true}) : x;
            });
            try{
              await db.doc('entries/'+activeRestaurant).set({items: next});
              showResults();
            }catch(err){ console.error(err); }
          }, 'Да', 'Нет');
        };
      });
    }

    root.querySelector('#histShow').onclick = showResults;

    root.querySelector('#histClose').onclick = function(){ root.innerHTML=''; };
    root.querySelector('#modalBg').addEventListener('click', function(e){ if(e.target.id==='modalBg') root.innerHTML=''; });
  }

  async function openCodesModal(){
    var root = document.getElementById('modalRoot');
    var c;
    try{ c = (await db.doc('config/codes').get()).data() || {}; }catch(e){ return; }
    var rows = '<div class="code-row"><span>Товаровед</span><input type="text" id="code_tovaroved" value="'+esc(c.tovaroved||'')+'"></div>';
    RESTAURANTS.forEach(function(r){
      rows += '<div class="code-row"><span>'+esc(r.name)+'</span><input type="text" id="code_'+r.id+'" value="'+esc(c[r.id]||'')+'"></div>';
    });
    root.innerHTML =
      '<div class="modal-bg" id="modalBg"><div class="modal">'+
      '<h3>Коды доступа</h3>'+
      rows+
      '<button class="primary-btn" id="codesSave" style="margin-top:14px;">Сохранить</button>'+
      '<button class="close" id="codesClose">Закрыть</button>'+
      '</div></div>';
    root.querySelector('#codesClose').onclick = function(){ root.innerHTML=''; };
    root.querySelector('#modalBg').addEventListener('click', function(e){ if(e.target.id==='modalBg') root.innerHTML=''; });
    root.querySelector('#codesSave').onclick = async function(){
      var updated = {tovaroved: root.querySelector('#code_tovaroved').value.trim() || c.tovaroved};
      RESTAURANTS.forEach(function(r){
        updated[r.id] = root.querySelector('#code_'+r.id).value.trim() || c[r.id];
      });
      var tooShort = Object.keys(updated).some(function(k){ return String(updated[k]).length < 4; });
      if(tooShort){ alert('Каждый код должен быть не короче 4 символов. Чем длиннее, тем безопаснее.'); return; }
      try{
        await db.doc('config/codes').set(updated);
        if(session && session.role === 'tovaroved'){ session.code = updated.tovaroved; saveSession(session); }
        root.innerHTML = '';
      }catch(e){ console.error(e); }
    };
  }

  init();
})();
</script>
