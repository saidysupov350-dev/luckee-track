<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Обучение поваров</title>
<style>
:root{
  --accent:#1f7a4d; --accent-dark:#175c3a; --accent-light:#e6f3ec;
  --bg:#f6f7f5; --card:#ffffff; --text:#16201b; --muted:#6b7972; --border:#e2e6e3;
}
*{box-sizing:border-box;}
body{margin:0; min-height:100vh; background:var(--bg); color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;}
.wrap{max-width:640px; margin:0 auto; padding:16px 16px 60px;}
h1{font-size:22px; margin:0 0 4px; font-weight:700;}
.sub{color:var(--muted); font-size:14px; margin-bottom:16px;}
.tabs{display:flex; gap:4px; background:var(--card); border:1px solid var(--border); border-radius:12px; padding:4px; margin-bottom:16px;}
.tab{flex:1; text-align:center; padding:10px 8px; border-radius:9px; font-size:14px; font-weight:600; color:var(--muted); cursor:pointer; border:none; background:none;}
.tab.active{background:var(--accent-light); color:var(--accent-dark);}
.pillrow{display:flex; gap:8px; overflow-x:auto; margin-bottom:14px; padding-bottom:2px;}
.pill{flex:none; padding:9px 16px; border-radius:20px; border:1px solid var(--border); background:var(--card); font-size:14px; cursor:pointer; white-space:nowrap;}
.pill.active{background:var(--accent); border-color:var(--accent); color:#fff;}
.card{background:var(--card); border:1px solid var(--border); border-radius:14px; padding:14px 16px; margin-bottom:10px; cursor:pointer;}
.card .name{font-weight:600; font-size:15px;}
.card .meta{color:var(--muted); font-size:12px; margin-top:2px;}
.detail{margin-top:10px; border-top:1px solid var(--border); padding-top:10px; display:none;}
.detail.open{display:block;}
.ing-row{display:flex; justify-content:space-between; padding:5px 0; font-size:14px; border-bottom:1px solid #f0f0ee;}
.ing-row:last-child{border-bottom:none;}
.method{font-size:13px; color:var(--muted); margin-top:10px; line-height:1.5;}
.badge{display:inline-block; background:var(--bg); border:1px solid var(--border); border-radius:6px; padding:2px 8px; font-size:12px; color:var(--muted); margin-right:6px;}
.primary-btn{background:var(--accent); color:#fff; border:none; border-radius:10px; padding:13px; font-size:15px; font-weight:600; cursor:pointer; width:100%;}
.ghost-btn{background:none; border:1px solid var(--border); color:var(--text); border-radius:10px; padding:11px; font-size:14px; font-weight:600; cursor:pointer; width:100%;}
.qcard{background:var(--card); border:1px solid var(--border); border-radius:16px; padding:20px; text-align:center;}
.qcard .dish{font-size:13px; color:var(--muted); margin-bottom:6px;}
.qcard .question{font-size:17px; font-weight:600; margin-bottom:20px;}
.opt{display:block; width:100%; padding:14px; margin-bottom:10px; border-radius:12px; border:1px solid var(--border); background:var(--card); font-size:15px; cursor:pointer; text-align:center;}
.opt.correct{background:#e8f5e9; border-color:#4caf50; color:#2e7d32; font-weight:700;}
.opt.wrong{background:#fdecea; border-color:#e57373; color:#c62828;}
.opt[disabled]{cursor:default;}
.progress{font-size:13px; color:var(--muted); margin-bottom:10px; text-align:center;}
.result{text-align:center; padding:30px 16px;}
.result .score{font-size:48px; font-weight:800; color:var(--accent);}
.result .label{color:var(--muted); font-size:14px; margin-top:4px;}
.setup-field{margin-bottom:16px;}
.setup-field label{display:block; font-size:13px; color:var(--muted); margin-bottom:8px; font-weight:600;}

input[type=text],input[type=number],select,textarea{font-family:inherit; font-size:16px; padding:12px 14px; border-radius:12px; border:1px solid var(--border); background:var(--card); color:var(--text); width:100%;}
textarea{resize:vertical;}
.linkbtn{background:none; border:none; color:var(--accent); font-size:15px; font-weight:600; cursor:pointer; padding:8px 0; font-family:inherit;}
.empty{color:var(--muted); font-size:14px; padding:8px 0;}
.card.row{display:flex; justify-content:space-between; align-items:center; gap:10px; cursor:default;}
.card.row .ghost-btn{width:auto; padding:9px 14px;}
.modal-bg{position:fixed; inset:0; background:rgba(0,0,0,.45); display:flex; align-items:flex-end; justify-content:center; z-index:50;}
.modal{background:var(--card); border-radius:18px 18px 0 0; padding:20px; width:100%; max-width:640px; max-height:88vh; overflow:auto; padding-bottom:calc(20px + env(safe-area-inset-bottom,0px));}
.modal h3{margin:0 0 14px;}
.modal .close{display:block; margin:14px auto 0; background:none; border:none; color:var(--muted); font-size:15px; cursor:pointer;}
.big-add{margin-bottom:14px;}

.pick-btn{flex:1 1 100%; text-align:left; font-family:inherit; font-size:16px; padding:12px 14px; border-radius:12px; border:1px solid var(--border); background:var(--card); color:var(--text); cursor:pointer; display:flex; justify-content:space-between; align-items:center; gap:8px;}
.pick-btn.placeholder{color:var(--muted);}
.pick-sub{display:block; font-size:12px; color:var(--muted); margin-top:2px;}
.picker-bg{position:fixed; inset:0; background:var(--bg); z-index:80;}
.picker{max-width:640px; height:100%; margin:0 auto; display:flex; flex-direction:column; padding:16px; padding-top:calc(16px + env(safe-area-inset-top,0px)); padding-bottom:calc(16px + env(safe-area-inset-bottom,0px));}
.picker-head{display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;}
.picker-title{font-size:18px; font-weight:700;}
.picker-list{flex:1; overflow-y:auto; margin-top:4px; -webkit-overflow-scrolling:touch;}
.pk-item{display:block; width:100%; text-align:left; background:var(--card); border:1px solid var(--border); border-radius:12px; padding:12px 14px; margin-bottom:8px; cursor:pointer; font-family:inherit; font-size:15px; color:var(--text);}
.pk-item .pk-name{font-weight:600;}
.pk-item .pk-tags{margin-top:5px;}
.pk-hint{color:var(--muted); font-size:13px; text-align:center; padding:8px 0;}
</style>
</head>
<body>
<div id="entryScreen" style="max-width:420px; margin:40px auto; padding:20px;">
  <h1 style="text-align:center;">Гид для поваров</h1>
  <div class="sub" style="text-align:center;">Прежде чем начать, представьтесь</div>
  <div class="setup-field">
    <label>Имя</label>
    <input type="text" id="entryName" placeholder="Например, Асан">
  </div>
  <div class="setup-field">
    <label>Ресторан</label>
    <select id="entryRest" style="width:100%; padding:12px 14px; border-radius:12px; border:1px solid var(--border); background:var(--card); font-size:15px;">
      <option>Luckee Yu Достык</option>
      <option>Luckee Yu Достык Плаза</option>
      <option>Luckee Yu Мега Алматы</option>
      <option>Luckee Yu Мега Астана</option>
    </select>
  </div>
  <div class="setup-field">
    <label>Станция</label>
    <div class="pillrow" id="entryStationPills"></div>
  </div>
  <div class="setup-field">
    <label>Что хотите сделать</label>
    <div class="pillrow" id="entryModePills"></div>
  </div>
  <button class="primary-btn" id="entryStartBtn">Начать</button>
  <div class="msg" id="entryMsg" style="color:#c0453a; font-size:13px; margin-top:8px; min-height:16px;"></div>
  <button class="linkbtn" id="showAdminLoginBtn" style="display:block; margin:16px auto 0;">🔐 Я администратор</button>
  <div style="text-align:center; color:#9aa79f; font-size:11px; margin-top:8px;">версия 10</div>
</div>

<div id="adminLoginScreen" style="display:none; max-width:420px; margin:40px auto; padding:20px;">
  <h1 style="text-align:center;">Вход администратора</h1>
  <div class="setup-field">
    <label>Код администратора</label>
    <input type="text" id="adminCodeInput" placeholder="Код">
  </div>
  <button class="primary-btn" id="adminCodeBtn">Войти</button>
  <div class="msg" id="adminCodeMsg" style="color:#c0453a; font-size:13px; margin-top:8px; min-height:16px;"></div>
  <button class="linkbtn" id="backToEntryBtn" style="display:block; margin:16px auto 0;">← Назад</button>
</div>

<div id="mainApp" style="display:none;">
<div class="wrap">
  <div style="display:flex; justify-content:space-between; align-items:flex-start;">
    <div>
      <h1>Гид для поваров</h1>
      <div class="sub" id="userInfoLine" style="margin-bottom:0;"></div>
    </div>
    <button class="tab" id="changeUserBtn" style="width:auto; padding:8px 12px;">Сменить</button>
  </div>
  <div class="sub">Граммовки и приготовление — изучение и тест</div>

  <div class="tabs">
    <button class="tab active" id="tabStudy">📖 Изучение</button>
    <button class="tab" id="tabQuiz">📝 Тест</button>
    <button class="tab" id="tabResults">📊 Результаты</button>
  </div>

  <div id="studyScreen">
    <div class="pillrow" id="stationPillsStudy"></div>
    <div class="pillrow" id="typePillsStudy"></div>
    <div id="dishList"></div>
  </div>

  <div id="quizScreen" style="display:none;">
    <div id="quizSetup">
      <div class="setup-field">
        <label>Станция</label>
        <div class="pillrow" id="stationPillsQuiz"></div>
      </div>
      <div class="setup-field">
        <label>Тип</label>
        <div class="pillrow" id="typePillsQuiz"></div>
      </div>
      <div class="setup-field">
        <label>Сложность</label>
        <div class="pillrow" id="difficultyPills"></div>
      </div>
      <div class="setup-field">
        <label>Количество вопросов</label>
        <div class="pillrow" id="countPills"></div>
      </div>
      <button class="primary-btn" id="startQuizBtn">Начать тест</button>
    </div>
    <div id="quizPlay" style="display:none;"></div>
    <div id="quizResult" style="display:none;"></div>
  </div>

  <div id="resultsScreen" style="display:none;">
    <div class="pillrow" id="resultsStationPills"></div>
    <div id="resultsList"></div>
  </div>
</div>
</div>

<div id="adminScreen" style="display:none;">
  <div class="wrap">
    <div style="display:flex; justify-content:space-between; align-items:flex-start;">
      <h1>Тех.карты (админ) <span style="font-size:11px; color:#9aa79f; font-weight:400;">v10</span></h1>
      <button class="tab" id="adminLogoutBtn" style="width:auto; padding:8px 12px;">Выйти</button>
    </div>

    <div id="adminDishesScreen">
      <button class="primary-btn big-add" id="addDishBtn">+ Создать ТТК (тех.карту)</button>
      <div class="pillrow" id="adminDishStationPills"></div>
      <div id="adminDishList"></div>
    </div>
  </div>
</div>

let quizQuestions = [];
let quizIndex = 0;
let quizScore = 0;
let quizWrongList = [];
let quizTimer = null;
let quizTimeLeft = 0;
const QUESTION_SECONDS = 15;
const PASS_THRESHOLD = 0.8;

function buildQuestionPool(){
  const pool = [];
  const list = DISHES.filter(d => (quizStation==='Все станции' || d.station===quizStation) && matchesType(d, quizType));
  list.forEach(d=>{
    // "Базовый" = только первый (главный) ингредиент каждого блюда/заготовки,
    // "Продвинутый" = все ингредиенты, включая соусы и специи
    const ings = quizDifficulty==='Базовый' ? d.ingredients.slice(0,1) : d.ingredients;
    ings.forEach(ing=>{
      pool.push({dish:d.name, station:d.station, ingredient:ing.name, unit:ing.unit, netto:ing.netto});
    });
  });
  return pool;
}

function pickDistractors(correct, unit, allPool, n){
  const candidates = allPool.filter(x=>x.unit===unit && x.netto!==correct);
  const uniqueVals = [...new Set(candidates.map(x=>x.netto))];
  // prefer values close in magnitude to the correct one (0.3x–3x range) so options
  // stay plausible and don't create "noise" from wildly different scales
  const close = uniqueVals.filter(v => v >= correct*0.3 && v <= correct*3);
  const far = uniqueVals.filter(v => v < correct*0.3 || v > correct*3);
  function shuffle(arr){
    for(let i=arr.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [arr[i],arr[j]]=[arr[j],arr[i]]; }
    return arr;
  }
  shuffle(close); shuffle(far);
  const picked = close.slice(0, n);
  if(picked.length < n) picked.push(...far.slice(0, n-picked.length));
  return picked;
}

document.getElementById('startQuizBtn').onclick = ()=>{
  const pool = buildQuestionPool();
  if(pool.length < 4){ alert('Недостаточно данных для теста в этой станции.'); return; }
  const shuffled = pool.slice();
  for(let i=shuffled.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [shuffled[i],shuffled[j]]=[shuffled[j],shuffled[i]]; }
  quizQuestions = shuffled.slice(0, Math.min(quizCount, shuffled.length));
  quizIndex = 0; quizScore = 0; quizWrongList = [];
  quizInProgress = true;
  document.getElementById('tabStudy').style.opacity='0.5';
  document.getElementById('quizSetup').style.display='none';
  document.getElementById('quizResult').style.display='none';
  document.getElementById('quizPlay').style.display='block';
  renderQuestion();
};

function renderQuestion(){
  const q = quizQuestions[quizIndex];
  const pool = buildQuestionPool();
  const distractors = pickDistractors(q.netto, q.unit, pool, 3);
  let options = [q.netto, ...distractors];
  if(options.length < 4){
    // pad with synthetic distractors if not enough real data
    while(options.length<4){ options.push(q.netto * (1 + (options.length*0.3+0.2))); }
  }
  for(let i=options.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [options[i],options[j]]=[options[j],options[i]]; }

  const el = document.getElementById('quizPlay');
  el.innerHTML = `<div class="progress">Вопрос ${quizIndex+1} из ${quizQuestions.length} · счёт: ${quizScore} · <span id="timerLabel">${QUESTION_SECONDS}</span> сек</div>
    <div class="qcard">
      <div class="dish">${esc(q.dish)} (${esc(q.station)})</div>
      <div class="question">Сколько нужно «${esc(q.ingredient)}»?</div>
      <div id="optsWrap"></div>
    </div>`;
  const wrap = document.getElementById('optsWrap');

  function stopTimer(){ if(quizTimer){ clearInterval(quizTimer); quizTimer=null; } }

  function answer(val, timedOut){
    stopTimer();
    wrap.querySelectorAll('.opt').forEach(o=>o.disabled=true);
    const isCorrect = !timedOut && Math.abs(val - q.netto) < 1e-9;
    if(isCorrect){ quizScore++; }
    else {
      quizWrongList.push({q, given: timedOut ? null : val});
    }
    [...wrap.children].forEach(o=>{
      if(o.dataset.v && Math.abs(parseFloat(o.dataset.v)-q.netto)<1e-9) o.classList.add('correct');
      else if(o.dataset.v && !timedOut && Math.abs(parseFloat(o.dataset.v)-val)<1e-9 && !isCorrect) o.classList.add('wrong');
    });
    setTimeout(()=>{
      quizIndex++;
      if(quizIndex < quizQuestions.length) renderQuestion();
      else renderResult();
    }, isCorrect ? 600 : 1400);
  }

  options.forEach(val=>{
    const btn = document.createElement('button');
    btn.className='opt';
    btn.textContent = fmtQty(q.unit, val);
    btn.dataset.v = val;
    btn.onclick = ()=> answer(val, false);
    wrap.appendChild(btn);
  });

  quizTimeLeft = QUESTION_SECONDS;
  quizTimer = setInterval(()=>{
    quizTimeLeft--;
    const lbl = document.getElementById('timerLabel');
    if(lbl) lbl.textContent = quizTimeLeft;
    if(quizTimeLeft <= 0){
      answer(null, true);
    }
  }, 1000);
}

function renderResult(){
  quizInProgress = false;
  document.getElementById('tabStudy').style.opacity='1';
  document.getElementById('quizPlay').style.display='none';
  const el = document.getElementById('quizResult');
  el.style.display='block';
  const pct = Math.round(100*quizScore/quizQuestions.length);
  const passed = (quizScore/quizQuestions.length) >= PASS_THRESHOLD;
  let wrongHtml = '';
  if(quizWrongList.length){
    wrongHtml = '<div style="text-align:left; margin-top:20px;"><div style="font-weight:700; margin-bottom:8px;">Разбор ошибок:</div>' +
      quizWrongList.map(w=>`<div class="ing-row"><span>${esc(w.q.dish)} — ${esc(w.q.ingredient)}${w.given===null?' (время вышло)':''}</span><span>верно: <b>${fmtQty(w.q.unit,w.q.netto)}</b></span></div>`).join('') +
      '</div>';
  }
  el.innerHTML = `<div class="result">
      <div class="score">${quizScore}/${quizQuestions.length}</div>
      <div class="label">${pct}% правильных ответов</div>
      <div class="label" style="margin-top:8px; font-weight:700; color:${passed?'#2e7d32':'#c62828'};">${passed?'✅ Сдал':'❌ Нужно пересдать (нужно 80%+)'}</div>
    </div>
    ${wrongHtml}
    <button class="ghost-btn" id="retryBtn" style="margin-top:20px;">Пройти ещё раз</button>`;
  document.getElementById('retryBtn').onclick = ()=>{
    document.getElementById('quizResult').style.display='none';
    document.getElementById('quizSetup').style.display='block';
  };
  saveQuizResult({score:quizScore, total:quizQuestions.length, pct, passed});
}

}
function getAllProducts(){
  const out = PRODUCT_SEED.map(p=>({name:p.n, unit:p.u, article:p.a||'', kind:p.t}));
  const seen = new Set(out.map(p=>p.name.toLowerCase()+'|'+p.unit));
  EXTRA_PRODUCTS.forEach(p=>{
    if(!p.name) return;
    const k = p.name.toLowerCase()+'|'+p.unit;
    if(seen.has(k)) return;
    seen.add(k);
    out.push({name:p.name, unit:p.unit, article:p.article||'', kind:p.kind||'p', custom:true});
  });
  return out.sort((a,b)=>a.name.localeCompare(b.name,'ru'));
}

function openProductPicker(onPick){
  const root = document.getElementById('pickerRoot');
  const all = getAllProducts();
  let query = '', kind = 'all';
  const KINDS = [['all','Все'],['p','Продукты'],['pf','Полуфабрикаты']];
  const LIMIT = 80;

  root.innerHTML = `<div class="picker-bg"><div class="picker">
    <div class="picker-head"><div class="picker-title">Выбор продукта</div><button type="button" class="linkbtn" id="pkClose">Закрыть</button></div>
    <input type="text" id="pkSearch" placeholder="Поиск: название или артикул" autocomplete="off">
    <div class="pillrow" id="pkKinds" style="margin:10px 0 4px;"></div>
    <div class="picker-list" id="pkList"></div>
    <button type="button" class="primary-btn" id="pkNew" style="margin-top:10px;">+ Добавить новый продукт</button>
  </div></div>`;

  function renderKinds(){
    const el = root.querySelector('#pkKinds');
    el.innerHTML = KINDS.map(([k,l])=>`<button type="button" class="pill ${k===kind?'active':''}" data-k="${k}">${l}</button>`).join('');
    el.querySelectorAll('button').forEach(b=>b.onclick=()=>{ kind=b.dataset.k; renderKinds(); renderList(); });
  }
  function renderList(){
    const q = query.trim().toLowerCase();
    let list = all.filter(p=>(kind==='all' || p.kind===kind) && (!q || p.name.toLowerCase().includes(q) || (p.article||'').includes(q)));
    const total = list.length;
    const shown = list.slice(0, LIMIT);
    const el = root.querySelector('#pkList');
    if(total===0){
      el.innerHTML = '<div class="pk-hint">Ничего не найдено. Нажмите «+ Добавить новый продукт» внизу.</div>';
      return;
    }
    el.innerHTML = shown.map((p,i)=>`<button type="button" class="pk-item" data-i="${i}">
        <div class="pk-name">${esc(p.name)}</div>
        <div class="pk-tags"><span class="badge">${esc(p.unit)}</span>${p.article?`<span class="badge">№${esc(p.article)}</span>`:''}${p.kind==='pf'?'<span class="badge">полуфабрикат</span>':''}${p.custom?'<span class="badge">добавлен вручную</span>':''}</div>
      </button>`).join('') + (total>LIMIT?`<div class="pk-hint">Показано ${LIMIT} из ${total} — уточните поиск</div>`:'');
    el.querySelectorAll('.pk-item').forEach(b=>b.onclick=()=>{
      const prod = shown[parseInt(b.dataset.i)];
      root.innerHTML='';
      onPick(prod);
    });
  }
  const searchEl = root.querySelector('#pkSearch');
  searchEl.addEventListener('input', e=>{ query = e.target.value; renderList(); });
  root.querySelector('#pkClose').onclick = ()=>{ root.innerHTML=''; };
  root.querySelector('#pkNew').onclick = ()=> openNewProductForm(query, onPick);
  renderKinds(); renderList();
}

function openNewProductForm(prefillName, onPick){
  const root = document.getElementById('pickerRoot');
  const UNITS = ['кг','л','шт','г','порц'];
  const f = {name:(prefillName||'').trim(), unit:'кг', kind:'p', article:''};
  function render(){
    root.innerHTML = `<div class="picker-bg"><div class="picker">
      <div class="picker-head"><div class="picker-title">Новый продукт</div><button type="button" class="linkbtn" id="npBack">Назад</button></div>
      <div class="setup-field"><label>Название</label><input type="text" id="npName" value="${esc(f.name)}"></div>
      <div class="setup-field"><label>Единица измерения</label>
        <div class="pillrow">${UNITS.map(u=>`<button type="button" class="pill ${u===f.unit?'active':''}" data-u="${u}">${u}</button>`).join('')}</div>
      </div>
      <div class="setup-field"><label>Что это</label>
        <div class="pillrow">
          <button type="button" class="pill ${f.kind==='p'?'active':''}" data-kind="p">Продукт</button>
          <button type="button" class="pill ${f.kind==='pf'?'active':''}" data-kind="pf">Полуфабрикат</button>
        </div>
      </div>
      <div class="setup-field"><label>Артикул (необязательно)</label><input type="text" id="npArticle" value="${esc(f.article)}"></div>
      <button type="button" class="primary-btn" id="npSave">Сохранить и выбрать</button>
    </div></div>`;
    const sync = ()=>{ f.name = root.querySelector('#npName').value; f.article = root.querySelector('#npArticle').value; };
    root.querySelectorAll('[data-u]').forEach(b=>b.onclick=()=>{ sync(); f.unit=b.dataset.u; render(); });
    root.querySelectorAll('[data-kind]').forEach(b=>b.onclick=()=>{ sync(); f.kind=b.dataset.kind; render(); });
    root.querySelector('#npBack').onclick = ()=> openProductPicker(onPick);
    root.querySelector('#npSave').onclick = async ()=>{
      sync();
      const name = f.name.trim();
      if(!name){ alert('Введите название продукта.'); return; }
      const prod = {name, unit:f.unit, kind:f.kind, article:f.article.trim()};
      try{
        await apiPost({action:'addProduct', code:getAdminCode(), product:prod});
        EXTRA_PRODUCTS.push(prod);
      }catch(e){ console.error(e); alert('Не удалось сохранить в общий список — продукт добавлен только в эту тех.карту.'); }
      root.innerHTML='';
      onPick({name:prod.name, unit:prod.unit, article:prod.article, kind:prod.kind});
    };
  }
  render();
}

function openDishEditor(dish){
  const isNew = !dish;
  const d = dish ? JSON.parse(JSON.stringify(dish)) : {id:null, name:'', section:'', station:'Вок', type:'блюдо', method:'', yield:null, time:null, ingredients:[{name:'',unit:'кг',netto:0}]};
  const root = document.getElementById('modalRoot');
  const UNIT_OPTIONS = ['кг','л','шт','г','порц'];

  function ingredientsHtml(){
    return d.ingredients.map((ing,i)=>`
      <div class="form-row" style="display:flex; flex-wrap:wrap; gap:6px; margin-bottom:12px; padding-bottom:10px; border-bottom:1px solid var(--border);">
        <button type="button" class="pick-btn ${ing.name?'':'placeholder'}" data-ing-pick="${i}">
          <span>${ing.name?esc(ing.name):'Выбрать продукт…'}${ing.article?`<span class="pick-sub">№${esc(ing.article)}</span>`:''}</span>
          <span>▾</span>
        </button>
        <select data-ing-unit="${i}" style="flex:1 1 80px;">
          ${UNIT_OPTIONS.map(u=>`<option ${u===ing.unit?'selected':''}>${u}</option>`).join('')}
        </select>
        <input type="number" step="any" data-ing-netto="${i}" placeholder="Кол-во" value="${ing.netto}" style="flex:1 1 100px;">
        <button class="linkbtn" data-ing-del="${i}" style="color:#c0453a;">✕</button>
      </div>`).join('');
  }

  function syncFromForm(){
    const nameEl = root.querySelector('#dName');
    if(!nameEl) return;
    d.name = nameEl.value;
    d.method = root.querySelector('#dMethod').value;
    d.yield = root.querySelector('#dYield').value.trim() || null;
    d.ingredients.forEach((ing,i)=>{
      const u = root.querySelector(`[data-ing-unit="${i}"]`);
      const q = root.querySelector(`[data-ing-netto="${i}"]`);
      if(u) ing.unit = u.value;
      if(q) ing.netto = q.value === '' ? 0 : parseFloat(q.value) || 0;
    });
  }

  function render(){
    root.innerHTML = `<div class="modal-bg" id="mbg"><div class="modal">
      <h3>${isNew?'Новая тех.карта':'Изменить тех.карту'}</h3>
      <div class="setup-field"><label>Название</label><input type="text" id="dName" value="${esc(d.name)}"></div>
      <div class="setup-field"><label>Станция</label>
        <div class="pillrow" id="dStationPills">
          ${['Вок','Горячий цех','Суши станция'].map(s=>`<button type="button" class="pill ${s===d.station?'active':''}" data-station="${esc(s)}">${esc(s)}</button>`).join('')}
        </div>
      </div>
      <div class="setup-field"><label>Тип</label>
        <div class="pillrow" id="dTypePills">
          <button type="button" class="pill ${d.type==='блюдо'?'active':''}" data-type="блюдо">Готовое блюдо</button>
          <button type="button" class="pill ${d.type==='заготовка'?'active':''}" data-type="заготовка">Заготовка</button>
        </div>
      </div>
      <div class="setup-field"><label>Ингредиенты и граммовка</label><div id="ingList">${ingredientsHtml()}</div>
        <button class="linkbtn" id="addIngBtn">+ Добавить ингредиент</button>
      </div>
      <div class="setup-field"><label>Способ приготовления</label><textarea id="dMethod" rows="4">${esc(d.method||'')}</textarea></div>
      <div class="setup-field"><label>Выход (кг, необязательно)</label><input type="text" id="dYield" value="${esc(d.yield||'')}"></div>
      <button class="primary-btn" id="dSaveBtn">Сохранить</button>
      ${!isNew ? '<button class="ghost-btn" id="dDeleteBtn" style="margin-top:10px; color:#c0453a;">Удалить тех.карту</button>' : ''}
      <button class="close" id="dCloseBtn">Отмена</button>
    </div></div>`;

    root.querySelector('#dCloseBtn').onclick = ()=>root.innerHTML='';
    root.querySelector('#mbg').addEventListener('click', e=>{ if(e.target.id==='mbg') root.innerHTML=''; });

    // добавить ингредиент = сразу открыть список продуктов
    root.querySelector('#addIngBtn').onclick = ()=>{
      syncFromForm();
      openProductPicker((prod)=>{
        const ing = {name:prod.name, unit:prod.unit, netto:0};
        if(prod.article) ing.article = prod.article;
        d.ingredients.push(ing);
        render();
      });
    };
    // выбрать/заменить продукт в существующей строке
    root.querySelectorAll('[data-ing-pick]').forEach(btn=>{
      btn.onclick = ()=>{
        syncFromForm();
        const i = parseInt(btn.dataset.ingPick);
        openProductPicker((prod)=>{
          d.ingredients[i].name = prod.name;
          d.ingredients[i].unit = prod.unit;
          if(prod.article) d.ingredients[i].article = prod.article; else delete d.ingredients[i].article;
          render();
        });
      };
    });

    root.querySelectorAll('[data-station]').forEach(btn=>{
      btn.onclick = ()=>{ syncFromForm(); d.station = btn.dataset.station; render(); };
    });
    root.querySelectorAll('[data-type]').forEach(btn=>{
      btn.onclick = ()=>{ syncFromForm(); d.type = btn.dataset.type; render(); };
    });
    root.querySelectorAll('[data-ing-del]').forEach(btn=>{
      btn.onclick = ()=>{ syncFromForm(); d.ingredients.splice(parseInt(btn.dataset.ingDel),1); render(); };
    });

    if(!isNew){
      root.querySelector('#dDeleteBtn').onclick = async ()=>{
        if(!confirm('Точно удалить тех.карту «'+d.name+'»?')) return;
        try{ await apiPost({action:'deleteDish', code:getAdminCode(), id:d.id}); }
        catch(e){ handleAdminErr(e); return; }
        root.innerHTML='';
        loadAdminDishes();
      };
    }

    root.querySelector('#dSaveBtn').onclick = async ()=>{
      syncFromForm();
      d.name = d.name.trim();
      d.method = (d.method||'').trim();
      d.ingredients = d.ingredients.filter(ing=>ing.name);
      if(!d.name || d.ingredients.length===0){ alert('Укажите название и выберите хотя бы один продукт.'); return; }
      const body = {name:d.name, section:d.section||'', station:d.station, type:d.type, method:d.method, yield:d.yield, time:d.time, ingredients:d.ingredients};
      if(!isNew) body.id = d.id;
      const saveBtn = root.querySelector('#dSaveBtn');
      saveBtn.disabled = true; saveBtn.textContent = 'Сохраняю…';
      try{ await apiPost({action:'saveDish', code:getAdminCode(), dish:body}); }
      catch(e){ saveBtn.disabled = false; saveBtn.textContent = 'Сохранить'; handleAdminErr(e); return; }
      root.innerHTML='';
      loadAdminDishes();
    };
  }
  render();
}
</script>
</body>
